  /v1/social/{storefront}/social-profiles:
    get:
      summary: Public profiles
      operationId: getSocialProfiles
      tags:
      - Social
      description: 'Reachable with only a developer token when looking a profile up by handle: replay
        returned 200 with `meta.filters.handle`. Fetching by `ids` with the follow state extended is what
        a signed-in request does.'
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: storefront
        in: path
        required: true
        schema:
          type: string
        description: Two-letter storefront code. An unknown code returns 400 `40009 Unknown Storefront`.
        example: us
      - name: ids
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated social profile ids.
      - name: filter[handle]
        in: query
        required: false
        schema:
          type: string
        description: Look a profile up by its handle.
        example: applemusic
      - $ref: '#/components/parameters/qL'
      - $ref: '#/components/parameters/qPlatform'
      - $ref: '#/components/parameters/qFormatResources'
      - name: include
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - followees
            - followers
            - listening-to
            - pending-followers
            - shareable-playlists
            - shared-playlists
            - social-profile
        description: Relationships to resolve in the same response. No request builder was found
          for this endpoint, so these are the values observed elsewhere for the same kind of resource.
        example:
        - followees
        - followers
        - listening-to
        - pending-followers
        - shareable-playlists
        - shared-playlists
        - social-profile
      - name: extend
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - followState
        description: Extra attributes to add to the returned resources. Unknown values are ignored rather
          than rejected.
        example:
        - followState
      - $ref: '#/components/parameters/qArtUrl'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        4XX:
          description: Request rejected. See the shared error-code table on the `Error` schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
