openapi: 3.1.0
info:
  title: MusicKit
  version: 0.1.0
  summary: Apple Music endpoints for catalog, library, and playback.
  description: 'Browse the Apple Music catalog, manage libraries and playlists, and request

    playback assets. These endpoints use `amp-api.music.apple.com` and the web

    player''s credentials. Tokens issued for `api.music.apple.com` are not

    interchangeable with credentials for this host.'
servers:
- url: https://amp-api.music.apple.com
  description: Default media API host.
security:
- developerToken: []
tags:
- name: Catalog
  description: 'Public catalog resources: albums, songs, artists, playlists, stations, charts, genres.'
- name: Search
  description: Catalog search, search suggestions and search hints.
- name: Editorial
  description: Editorially curated rooms, groupings, multirooms and multiplexes.
- name: Recommendations
  description: Storefront-level recommendation shelves.
- name: Concerts
  description: Concert hub and concert containers.
- name: Lyrics
  description: Lyric snippets used by search result highlights.
- name: Engagement
  description: Subscription upsell and marketing surfaces.
- name: Storefronts
  description: Storefront metadata.
- name: Account
  description: Signed-in account state and preferences.
- name: Library
  description: The signed-in user's library.
- name: Playlists
  description: Library playlist creation and editing.
- name: Pins
  description: Library pins shown on the library landing page.
- name: Social
  description: Apple Music social profiles, following and sharing.
- name: Playback
  description: Playback asset resolution and radio continuation, served by MusicKit.
paths:
  /v1/catalog/{storefront}:
    get:
      summary: Resources by ID
      operationId: getCatalogResourcesByIds
      tags:
      - Catalog
      x-confidence: high
      x-validation-status: replay-tested
      x-evidence:
      - asset: assets/index~8bc3c631ba.js
        location: line 33276
        excerpt: 'const i = new it(`/v1/catalog/${n}`, e); i.queryString.addParameters({ "ids[curators]":
          t.id, "ids[apple-curators]": t.id, ... })'
        discovery: static
      - asset: assets/index~8bc3c631ba.js
        location: line 43687
        excerpt: const s = new it(`/v1/catalog/${r}`, e)
        discovery: static
      description: 'Multi-fetch entry point. One `ids[<type>]` parameter per resource type; several may
        be combined in one request. Used by the curator page to fetch `curators` and `apple-curators`
        together, and by the generic content-descriptor loader.


        Requires at least one `ids[...]` parameter: an empty request returns 400 `40003 No ids specified
        on the request`.'
      x-feature: Curator page, generic resource loading
      x-callers:
      - AnyCuratorPageDetailIntent.perform
      - requestLibraryRelationships
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: storefront
        in: path
        required: true
        schema:
          type: string
        description: Two-letter storefront code. The client reads it from the `countryCode` bag key, default
          `us`. An unknown code returns 400 `40009 Unknown Storefront`.
        example: us
      - name: ids[albums]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
        description: Comma-separated album ids.
        x-confidence: high
        style: form
        explode: false
      - name: ids[songs]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
        description: Comma-separated song ids.
        x-confidence: high
        style: form
        explode: false
      - name: ids[artists]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
        description: Comma-separated artist ids.
        x-confidence: high
        style: form
        explode: false
      - name: ids[curators]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
        description: Comma-separated curator ids.
        x-confidence: high
        style: form
        explode: false
      - name: ids[apple-curators]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
        description: Comma-separated Apple curator ids.
        x-confidence: high
        style: form
        explode: false
      - name: ids[playlists]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
        description: Comma-separated playlist ids.
        x-confidence: medium
        x-validation-status: inferred from the `ids[<type>]` pattern; not replayed
        style: form
        explode: false
      - name: fields[albums]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: &id001
            - artistName
            - artistUrl
            - artwork
            - contentRating
            - editorialArtwork
            - editorialNotes
            - editorialVideo
            - genreNames
            - name
            - plainEditorialNotes
            - playParams
            - releaseDate
            - trackCount
            - url
        description: Sparse fieldset for albums.
        x-confidence: high
        style: form
        explode: false
        example: *id001
      - name: extend[curators]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: &id002
            - plainEditorialNotes
            - playlistCount
        description: Extra curator attributes, for example `playlistCount`.
        x-confidence: high
        style: form
        explode: false
        example: *id002
      - name: extend[apple-curators]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: &id003
            - plainEditorialNotes
