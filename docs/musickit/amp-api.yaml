          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
        musicUserToken: []
  /v1/play/assets:
    get:
      summary: Play assets
      operationId: getPlayAssets
      tags:
      - Playback
      description: 'MusicKit''s asset resolution step. The query is the item''s `playParams` object spread
        into query parameters, plus encryption options. Requires a subscribed account: without a `Media-User-Token`
        it returns 403 `40301 Invalid Music User Token`, and MusicKit maps a 403 with body code `40303`
        to a subscription error.


        The response carries signed HLS URLs and key-server URLs; they are omitted from this document
        because they are account-scoped.'
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: id
        in: query
        required: true
        schema:
          type: string
        description: From the item's `playParams.id`.
        example: '1752214923'
      - name: kind
        in: query
        required: true
        schema:
          type: string
        description: From the item's `playParams.kind`.
        example: song
      - name: keyFormat
        in: query
        required: false
        schema:
          type: string
          enum:
          - web
        description: The radio path sends `web`.
      - name: includeLicenseUrls
        in: query
        required: false
        schema:
          type: boolean
        description: Return key-server and certificate URLs alongside the asset.
      - name: hlsEncryption
        in: query
        required: false
        schema:
          type: string
          enum:
          - CBC
          - CTR
        description: HLS encryption mode. MusicKit defaults to `CBC`.
        example: CBC
      - name: hlsProfile
        in: query
        required: false
        schema:
          type: string
          enum:
          - enhancedHls
        description: Sent as `enhancedHls` when an enhanced asset is requested.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    properties:
                      assets:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                            keyServerUrl:
                              type: string
                            fairPlayKeyCertificateUrl:
                              type: string
                            widevineKeyCertificateUrl:
                              type: string
        '403':
          description: '`40301 Invalid Music User Token`, or body code `40303` for a missing subscription.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '500':
          description: MusicKit raises `mk-153` for this.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
        musicUserToken: []
  /v1/me/stations/next-tracks/{id}:
    post:
      summary: Station next tracks
      operationId: getStationNextTracks
      tags:
      - Playback
      description: A POST with no body; `limit` is the only parameter MusicKit sends.
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Station id.
        example: ra.978194965
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Tracks to return.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '403':
          description: '`40300 Forbidden` — no valid `Media-User-Token`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
        musicUserToken: []
  /v1/me/stations/continuous:
    post:
      summary: Autoplay station
      operationId: createContinuousStation
      tags:
      - Playback
      description: 'Backs autoplay. Each seed is a song or artist; library items are typed `library-songs`
        and catalog items `songs`. The response is `{ results: { station }, errors }` rather than the
        usual resource shape.'
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: limit[results:tracks]
        in: query
        required: false
        schema:
          type: integer
        description: Tracks to return with the station.
      - name: with
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - tracks
        description: Optional top-level sections to add to the response. Unknown values are ignored rather
          than rejected.
        example:
        - tracks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                        enum:
                        - songs
                        - library-songs
                        - artists
                      meta:
                        type: object
                        properties:
                          container:
                            type: object
                            additionalProperties: true
            example:
              data:
              - id: '1752214923'
                type: songs
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    properties:
                      station:
                        $ref: '#/components/schemas/Resource'
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '403':
          description: '`40300 Forbidden` — no valid `Media-User-Token`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
        musicUserToken: []
  /v1/me/recommendations/pivots:
    post:
      summary: Recommendation pivots
      operationId: getRecommendationPivots
      tags:
      - Playback
      description: 'Recommendation pivots, from the public MusicKit build only.


        Present only in the **public** MusicKit bundle (`js-cdn.music.apple.com/musickit/v3/musickit.js`);
        it does not appear in the available AMP bundle. Parameters and body were not recovered,
        so none are documented.


        Probing `/v1/me/recommendations/pivots` as a GET answers 404 `40400 Resource Not Found`, not a
        path error, so the segment is read as a recommendation id. The POST form remains unverified.'
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '403':
          description: '`40300 Forbidden` — no valid `Media-User-Token`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
        musicUserToken: []
  /WebObjects/MZPlay.woa/wa/webPlayback:
    post:
      summary: Web playback asset
      operationId: resolveWebPlaybackAsset
      tags:
      - Playback
      description: 'The second of MusicKit''s two asset resolvers. `/v1/play/assets` covers catalog streaming;
        this one covers purchased and uploaded library items, which the media API does not serve.


        The body names the item in one of two ways. A catalog item sends `salableAdamId`. A library item
        sends `purchaseAdamId`, `subscriptionAdamId` and, for a Music-Library upload, `universalLibraryId`.


        This host takes the user token in `X-Apple-Music-User-Token`, not the `Media-User-Token` header
        the media API uses.'
      servers:
      - url: https://play.itunes.apple.com
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: X-Apple-Music-User-Token
        in: header
        required: false
        schema:
          type: string
        description: Identifies the signed-in account for playback on this host.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                salableAdamId:
                  type: string
                  description: Catalog id. Sent for catalog items.
                purchaseAdamId:
                  type: string
                  description: Purchase id, from `playParams.purchasedId`.
                subscriptionAdamId:
                  type: string
                  description: Catalog id behind a library item.
                universalLibraryId:
                  type: string
                  description: Library id, for uploaded items.
            example:
              salableAdamId: '1752214923'
      responses:
        '200':
          description: Asset list. An empty or absent `songList` means the item is unavailable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  songList:
                    type: array
                    description: Assets for the requested item. MusicKit reads the first entry.
                    items:
                      type: object
                      properties:
                        hls-playlist-url:
                          type: string
                          description: Present for HLS assets.
                        hls-key-server-url:
                          type: string
                        hls-key-cert-url:
                          type: string
                        widevine-cert-url:
                          type: string
                        assets:
                          type: array
                          description: Progressive assets. `flavor` ends with the encoding and bitrate,
                            for example `cbcp256`.
                          items:
                            type: object
                            properties:
                              URL:
                                type: string
                              flavor:
                                type: string
                  failureType:
                    type: string
                    description: Set instead of `songList` when the request fails. MusicKit maps it to
                      a reason; the age-verification code raises `AGE_VERIFICATION_REQUIRED`.
        4XX:
          description: Request rejected. See the shared error-code table on the `Error` schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
  /WebObjects/MZPlay.woa/wa/acquireWebPlaybackLicense:
    post:
      summary: Web playback license
      operationId: acquireWebPlaybackLicense
      tags:
      - Playback
      description: 'The key server named by `keyServerUrl` in a `/v1/play/assets` response. The browser''s
        EME stack produces a key request; base64-encode it as `challenge` and post it here
        with the item it belongs to.


        Widevine playback adds an `X-Apple-Renewal: true` header.


        Two sibling key servers take a different body. `/v1/radio/streaming-key-delivery` and `/WebObjects/MZPlay.woa/web/radio/versions/1/license`
        accept this request shape; `fpsRequest` and `/v1/hls/streaming-key-delivery`
        do not.'
      servers:
      - url: https://play.itunes.apple.com
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: X-Apple-Music-User-Token
        in: header
        required: false
        schema:
          type: string
        description: Identifies the signed-in account for playback on this host.
      - name: X-Apple-Renewal
        in: header
        required: false
        schema:
          type: boolean
        description: Set to `true` for Widevine license renewal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - challenge
              - uri
              - key-system
              properties:
                adamId:
                  type: string
                  description: Catalog id of the item, or `-1` when it has none.
                isLibrary:
                  type: boolean
                  description: True when the item is a library item.
                user-initiated:
                  type: boolean
                  description: Whether a person started this playback rather than autoplay.
                challenge:
                  type: string
                  description: Base64 key-request blob produced by the browser's EME `keymessage` event.
                uri:
                  type: string
                  description: The `skd:` or `widevine:` key URI from the HLS playlist.
                key-system:
                  type: string
                  enum:
                  - com.apple.fps
                  - com.widevine.alpha
      responses:
        '200':
          description: License response. The key payload is account-scoped and is not reproduced here.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        4XX:
          description: Request rejected. See the shared error-code table on the `Error` schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
  /WebObjects/MZPlay.woa/wa/fpsRequest:
    post:
      summary: FairPlay keys
      operationId: requestFairPlayStreamingKey
      tags:
      - Playback
      description: 'The older of the two key-request shapes. This request shape applies when the key server URL ends in `fpsRequest`, `/WebObjects/MZPlay.woa/hls/anonymous/fpsRequest`, `/v1/hls/streaming-key-delivery`
        or `/v1/hls/anonymous/streaming-key-delivery`.


        It batches keys: the body is a `license-requests` array and `id` is a per-request counter so it can match responses back.


        The `anonymous` variants skip the user token; every other variant requires it.'
      servers:
      - url: https://play.itunes.apple.com
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: X-Apple-Music-User-Token
        in: header
        required: false
        schema:
          type: string
        description: Identifies the signed-in account for playback on this host.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - version
              - license-requests
              properties:
                version:
                  type: integer
                  enum:
                  - 1
                license-requests:
                  type: array
                  items:
                    type: object
                    required:
                    - id
                    - challenge
                    - uri
                    - key-system
                    properties:
                      id:
                        type: integer
                        description: Client-assigned request id, incremented per request.
                      adam-id:
                        type: string
                      challenge:
                        type: string
                        description: Base64 key-request blob produced by the browser's EME `keymessage`
                          event.
                      uri:
                        type: string
                      key-system:
                        type: string
                        enum:
                        - com.apple.fps
                        - com.widevine.alpha
      responses:
        '200':
          description: License response, one entry per request in the batch.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        4XX:
          description: Request rejected. See the shared error-code table on the `Error` schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
  /v1/hls/streaming-key-delivery:
    post:
      summary: Streaming key delivery
      operationId: deliverStreamingKey
      tags:
      - Playback
      description: 'The leasing key server. Unlike the other two, it tracks a lease: use `lease-action: start` to acquire a key and `stop` to release it when playback ends, so a key can
        be revoked rather than only expiring.


        This request shape applies to four URLs, all matched by suffix: `/v1/hls/streaming-key-delivery`,
        `/v1/hls/anonymous/streaming-key-delivery`, `/WebObjects/MZPlay.woa/wa/fpsRequest` and `/WebObjects/MZPlay.woa/hls/anonymous/fpsRequest`.
        Anything containing `/hls/anonymous` is treated as anonymous playback and sent without a user
        token.


        The host is not fixed. It comes from `hls-key-server-url` in the asset response, so treat the
        path as the stable part.'
      servers:
      - url: https://play.itunes.apple.com
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: X-Apple-Music-User-Token
        in: header
        required: false
        schema:
          type: string
        description: Identifies the signed-in account for playback on this host.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - streaming-request
              properties:
                streaming-request:
                  type: object
                  required:
                  - version
                  - streaming-keys
                  properties:
                    version:
                      type: integer
                      enum:
                      - 1
                    streaming-keys:
                      type: array
                      items:
                        type: object
                        required:
                        - id
                        - challenge
                        - uri
                        - key-system
                        properties:
                          lease-action:
                            type: string
                            enum:
                            - start
                            - stop
                          id:
                            type: integer
                          challenge:
                            type: string
                            description: Base64 key-request blob produced by the browser's EME `keymessage`
                              event.
                          uri:
                            type: string
                          key-system:
                            type: string
                            enum:
                            - com.apple.fps
                            - com.widevine.alpha
                          stkn:
                            type: string
                            description: Streaming token carried between lease actions.
                        additionalProperties: true
      responses:
        '200':
          description: A key per entry in the request. A non-zero `status` on a key is a failure even
            though the HTTP status is 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  streaming-response:
                    type: object
                    properties:
                      streaming-keys:
                        type: array
                        items:
                          type: object
                          properties:
                            status:
                              type: integer
                              description: '`0` on success. Anything else is surfaced to the person as
                                a playback error.'
                          additionalProperties: true
        4XX:
          description: Request rejected. See the shared error-code table on the `Error` schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
  /WebObjects/MZPlay.woa/wa/widevineCert:
    get:
      summary: Widevine certificate
      operationId: getWidevineCertificate
      tags:
      - Playback
      description: 'The Widevine service certificate, needed before a Widevine key request can be encrypted.
        It is a fixed URL rather than a per-item one, and it takes no authentication.


        The FairPlay equivalent is not on this host: it is the static bundle at `https://s.mzstatic.com/skdtool_2021_certbundle.bin`.'
      servers:
      - url: https://play.itunes.apple.com
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      responses:
        '200':
          description: The certificate, as bytes.
          content:
            application/json:
              schema:
                type: string
                contentMediaType: application/octet-stream
        4XX:
          description: Request rejected. See the shared error-code table on the `Error` schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
      security: []
  /WebObjects/MZPlay.woa/wa/revokeMusicSDKAuthorizationSrv:
    post:
      summary: Revoke app access
      operationId: revokeMusicSDKAuthorization
      tags:
      - Account
      description: 'Backs the "remove app with access" control in account settings. The URL is configurable
        through the bag key `revokeMusicSDKAuthorizationSrv`; the value shown here is the fallback the
        fallback when the bag does not carry one.


        No response body is defined.


        Its read counterpart is the bag key `getMusicSDKAuthorizationsSrv`, which lists the authorized
        apps. Its URL is supplied by the bag and is not documented as a fixed path.'
      servers:
      - url: https://play.itunes.apple.com
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - musicId
              properties:
                musicId:
                  type: string
                  description: The app's identifier, as listed by `getMusicSDKAuthorizationsSrv`.
      responses:
        '200':
          description: Any 2xx is treated as success. No response body is defined.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        4XX:
          description: Request rejected. See the shared error-code table on the `Error` schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
      - musicUserToken: []
  /commerce/account/authenticateMusicKitRequest:
    post:
      summary: Sign in
      operationId: authenticateMusicKitRequest
      tags:
      - Account
      description: 'Starts MusicKit sign-in. MusicKit submits a hidden form into a 650 by 650 popup, so the response is an HTML sign-in page, not JSON.


        The popup reports back through `postMessage`. `authorize` carries the music user token, the restricted flag (`"1"` when parental restrictions apply) and the client id. `decline` means the person refused, and `unavailable` means the service is not offered to them.'
      servers:
      - url: https://buy.music.apple.com
      - url: https://buy.itunes.apple.com
        description: Used when the page is not served from an `apple.com` music host.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - jwtToken
              properties:
                jwtToken:
                  type: string
                  description: The developer token.
                isWebPlayer:
                  type: string
                  enum:
                  - 'true'
                LogoURL:
                  type: string
                  description: Sent empty by the web player.
      responses:
        '200':
          description: The sign-in page.
          content:
            text/html:
              schema:
                type: string
      security: []
  /account/web/info:
    get:
      summary: Account info
      operationId: getWebAccountInfo
      tags:
      - Account
      description: 'Account flags MusicKit reads after `/v1/me/account`. Sends cookies as well as tokens.


        If `privacyAcknowledgement` shows an outstanding acknowledgement, MusicKit calls [Refresh account info](/musickit/reference/account/refreshWebAccountInfo) and fetches this again.'
      servers:
      - url: https://buy.music.apple.com
      - url: https://buy.itunes.apple.com
        description: Used when the page is not served from an `apple.com` music host.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  isU13:
                    type: boolean
                    description: Whether the account belongs to a child under 13.
                  parentalControlsData:
                    type: object
                    description: Parental controls. MusicKit reads `musicParentalControlsEnabled` for music and `videoContentRestrictions` for TV.
                    properties:
                      musicParentalControlsEnabled:
                        type: boolean
                      videoContentRestrictions: {}
                    additionalProperties: true
                  privacyAcknowledgement:
                    type: object
                    description: Privacy notices and the versions the person has acknowledged.
                    additionalProperties: true
                  storeFrontISO3A:
                    type: string
                    description: Three-letter country code of the account's storefront.
                    example: USA
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
        musicUserToken: []
  /account/web/infoRefresh:
    get:
      summary: Refresh account info
      operationId: refreshWebAccountInfo
      tags:
      - Account
      description: Refreshes the account's client ids. MusicKit stores every key in the response, so `pldfltcid` and `pltvcid` come from here. Sends cookies as well as tokens.
      servers:
      - url: https://buy.music.apple.com
      - url: https://buy.itunes.apple.com
        description: Used when the page is not served from an `apple.com` music host.
      responses:
        '200':
          description: A map of client ids.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pldfltcid:
                    type: string
                    description: Default client id.
                  pltvcid:
                    type: string
                    description: TV client id.
                additionalProperties:
                  type: string
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
        musicUserToken: []
  /account/web/logout:
    post:
      summary: Sign out
      operationId: logoutWebAccount
      tags:
      - Account
      description: Ends the web session. MusicKit calls this before it clears its stored tokens, and ignores a failure. Sends cookies as well as tokens.
      servers:
      - url: https://buy.music.apple.com
      - url: https://buy.itunes.apple.com
        description: Used when the page is not served from an `apple.com` music host.
      responses:
        '200':
          description: Signed out. Any 2xx counts as success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
        musicUserToken: []
  /commerce/web/subscription/offers/music:
    get:
      summary: Subscription offers
      operationId: getMusicSubscriptionOffers
      tags:
      - Engagement
      description: 'Apple Music subscription offers for a storefront. Works signed out; when signed in, MusicKit also sends the developer token and `Music-User-Token`.


        MusicKit picks the storefront from the account when signed in, and from the browser languages otherwise. It returns an empty list without calling this when it cannot map the storefront or language to an id.'
      servers:
      - url: https://buy.music.apple.com
      - url: https://buy.itunes.apple.com
        description: Used when the page is not served from an `apple.com` music host.
      parameters:
      - name: X-Apple-Store-Front
        in: header
        required: true
        schema:
          type: string
        description: Numeric storefront id and language id, followed by `,8`.
        example: 143441-1,8
      - name: Music-User-Token
        in: header
        required: false
        schema:
          type: string
        description: Sent when signed in.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      type: object
                      properties:
                        subscriptionType:
                          type: string
                          description: The upsell banner uses the `Individual` offer.
                          example: Individual
                        price:
                          type: string
                        isIntroOffer:
                          type: boolean
                        introOfferPrice:
                          type: string
                          description: A price of zero means a free trial.
                        introPeriod:
                          type: string
                          description: ISO 8601 duration in months.
                          example: P1M
                      additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - developerToken: []
  /account/v1/affiliation/association:
    post:
      summary: Affiliate attribution
      operationId: associateAffiliation
      tags:
      - Engagement
      description: 'Records campaign and affiliate attribution for a landing URL. The web player only calls this when the page URL carries one of `affC`, `adId`, `advp`, `at`, `ct`, `itsct`, `itscg`, `itscc`, `itcCt`, `its_qt`, `ls`, `partnerId`, `pt`, `qtkid` or `uo`. Sends cookies.


        Without an explicit endpoint the same request goes to `https://itunes.apple.com/WebObjects/MZStoreServices.woa/wa/processRedirectUrl`.'
      servers:
      - url: https://buy.music.apple.com
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  description: The landing URL, including its query string.
                ignoreMarketing:
                  type: string
                  enum:
                  - 'true'
      responses:
        '200':
          description: The client writes each entry of `setCookies` to `document.cookie` and navigates to `redirectUrl`. An empty body means no change.
          content:
            application/json:
              schema:
                type: object
                properties:
                  setCookies:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      - value
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                      additionalProperties:
                        type: string
                      description: Any other key becomes a cookie attribute.
                  redirectUrl:
                    type: string
      security: []
  /WebObjects/MZPlay.woa/wa/renewMusicToken:
    post:
      summary: Renew user token
      operationId: renewMusicToken
      tags:
      - Account
      description: Exchanges the current music user token for a fresh one. On 401 MusicKit signs the person out. A response without `music-token` keeps the old token.
      servers:
      - url: https://play.music.apple.com
      - url: https://play.itunes.apple.com
        description: Used when the page is not served from an `apple.com` music host.
      parameters:
      - name: X-Apple-Music-User-Token
        in: header
        required: true
        schema:
          type: string
        description: The token to renew.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  music-token:
                    type: string
                    description: The new music user token.
                additionalProperties: true
        '401':
          description: The token cannot be renewed.
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
  /v1/web/status:
    get:
      summary: Subscription status
      operationId: getWebSubscriptionStatus
      tags:
      - Account
      description: The account and its Apple Music subscription status, as used by the web player's upsell logic. Authenticated by cookies plus the developer token; no user token is sent.
      servers:
      - url: https://musicstatus.music.apple.com
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    type: object
                    additionalProperties: true
                  music:
                    type: object
                    description: Subscription status.
                    properties:
                      isNotEligibleForFreeTrial:
                        type: boolean
                    additionalProperties: true
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
  /v1/regions:
    get:
      summary: Regions
      operationId: listRegions
      tags:
      - Storefronts
      description: 'The five regions Apple sorts storefronts into.


        The five groupings Apple sorts storefronts into: `united-states-canada`, `latin-america-caribbean`,
        `asia-pacific`, `africa-middle-east-india` and `europe`.


        This path was found by probing and is listed because it is
        the only endpoint that names the grouping a storefront belongs to.'
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - $ref: '#/components/parameters/qL'
      - $ref: '#/components/parameters/qPlatform'
      - $ref: '#/components/parameters/qFormatResources'
      responses:
        '200':
          description: All five regions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          examples:
                          - asia-pacific
                        type:
                          type: string
                          enum:
                          - regions
                        href:
                          type: string
                        attributes:
                          type: object
                          properties:
                            name:
                              type: string
                              examples:
                              - Asia Pacific
        4XX:
          description: Request rejected. See the shared error-code table on the `Error` schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/regions/{id}:
    get:
      summary: One region
      operationId: getRegion
      tags:
      - Storefronts
      description: Returns a single-element `data` array, the same shape `/v1/regions` returns.
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Region id.
        example: asia-pacific
      - $ref: '#/components/parameters/qL'
      - $ref: '#/components/parameters/qPlatform'
      - $ref: '#/components/parameters/qFormatResources'
      responses:
        '200':
          description: The region.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          examples:
                          - asia-pacific
                        type:
                          type: string
                          enum:
                          - regions
                        href:
                          type: string
                        attributes:
                          type: object
                          properties:
                            name:
                              type: string
                              examples:
                              - Asia Pacific
        4XX:
          description: Request rejected. See the shared error-code table on the `Error` schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/social-profile:
    get:
      summary: My public profile
      operationId: getMySocialProfile
      tags:
      - Social
      description: 'The public view of the signed-in account''s social profile. It returns type `social-profiles`
        with an `href` pointing at `/v1/social/{storefront}/social-profiles/{id}`, where `/v1/me/social/profile`
        returns type `personal-social-profiles` with the private fields attached.


        Use this one to read your own handle, avatar and privacy setting. Use `/v1/me/social/profile`
        to change them.


        It takes no relationships: `/v1/me/social-profile/followees` is not routed.'
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - $ref: '#/components/parameters/qL'
      - $ref: '#/components/parameters/qPlatform'
      - $ref: '#/components/parameters/qFormatResources'
      - name: extend
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - followState
            - hideListeningTo
            - pendingFollowersCount
        description: Extra attributes to add to the returned resources. These values were observed on other endpoints for the same resource type.
          Unknown values are ignored rather than rejected.
        example:
        - followState
        - hideListeningTo
        - pendingFollowersCount
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '403':
          description: '`40300 Forbidden` — no valid `Media-User-Token`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
        musicUserToken: []
  /v1/catalog/{storefront}/songs/{id}/lyrics:
    get:
      summary: Lyrics
      operationId: getSongLyrics
      tags:
      - Lyrics
      description: 'Line-timed lyrics as a TTML document.


        `attributes.ttml` is a complete TTML document whose root carries `itunes:timing="Line"`. Each
        `<p>` is one line with `begin` and `end` times and a `ttm:agent` naming the voice. The head holds
        `iTunesMetadata` with `songwriters`, `translations` and a `leadingSilence` offset.


        Needs a subscribed account, and `storefront` must match the account''s own storefront. A
        mismatched storefront, an unsubscribed account and a song with no lyrics all return 404
        `40403`, so the cases cannot be told apart from the status.'
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: storefront
        in: path
        required: true
        schema:
          type: string
        description: Two-letter storefront code. An unknown code returns 400 `40009 Unknown Storefront`.
        example: us
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Catalog song id.
        example: '1752214923'
      - $ref: '#/components/parameters/qL'
      - $ref: '#/components/parameters/qPlatform'
      - $ref: '#/components/parameters/qFormatResources'
      responses:
        '200':
          description: One `lyrics` resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The song id, repeated.
                        type:
                          type: string
                          enum:
                          - lyrics
                        attributes:
                          type: object
                          properties:
                            ttml:
                              type: string
                              description: A TTML document. The root `tt` element carries `itunes:timing="Line"`
                                and `xml:lang`.
                            playParams:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: Lyric id, prefixed `AP_`.
                                catalogId:
                                  type: string
                                kind:
                                  type: string
                                  enum:
                                  - lyric
                                displayType:
                                  type: integer
                                  description: '`2` for line timing, `3` for word timing.'
        '404':
          description: '`40403 No related resources`. Also what an account without a subscription gets,
            so a 404 here is not proof the song has no lyrics.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
        musicUserToken: []
  /v1/catalog/{storefront}/songs/{id}/syllable-lyrics:
    get:
      summary: Syllable lyrics
      operationId: getSongSyllableLyrics
      tags:
      - Lyrics
      description: 'Word-timed lyrics as a TTML document.


        The same lyric as `lyrics`, timed per word rather than per line: the root carries `itunes:timing="Word"`
        and each `<p>` holds `<span>` elements with their own `begin` and `end`. Adjacent spans with no
        whitespace between them are syllables of one word, which is what drives the karaoke-style highlight.


        Backs Apple Music Sing. Use `l[lyrics]`, `l[script]` and `extend=ttmlLocalizations`
        together to request localized TTML. Same subscription requirement, same storefront-match
        requirement and same 404 as `lyrics`.'
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: storefront
        in: path
        required: true
        schema:
          type: string
        description: Two-letter storefront code. An unknown code returns 400 `40009 Unknown Storefront`.
        example: us
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Catalog song id.
        example: '1752214923'
      - $ref: '#/components/parameters/qL'
      - $ref: '#/components/parameters/qPlatform'
      - $ref: '#/components/parameters/qFormatResources'
      - name: l[lyrics]
        in: query
        required: false
        schema:
          type: string
        description: Preferred language for localized lyrics. Use with `extend=ttmlLocalizations`.
        example: zh-CN
      - name: l[script]
        in: query
        required: false
        schema:
          type: string
        description: Language and script for localized lyrics, such as `zh-Hans`.
        example: zh-Hans
      - name: extend
        in: query
        required: false
        schema:
          type: string
          enum:
          - ttmlLocalizations
        description: Requests `attributes.ttmlLocalizations`. Use with `l[lyrics]` and `l[script]`.
      responses:
        '200':
          description: One `syllable-lyrics` resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The song id, repeated.
                        type:
                          type: string
                          enum:
                          - syllable-lyrics
                        attributes:
                          type: object
                          properties:
                            ttml:
                              type: string
                              description: A TTML document. The root `tt` element carries `itunes:timing="Word"`
                                and `xml:lang`.
                            ttmlLocalizations:
                              type: string
                              description: Localized TTML requested by `extend=ttmlLocalizations`.
                            playParams:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: Lyric id, prefixed `AP_`.
                                catalogId:
                                  type: string
                                kind:
                                  type: string
                                  enum:
                                  - lyric
                                displayType:
                                  type: integer
                                  description: '`2` for line timing, `3` for word timing.'
        '404':
          description: '`40403 No related resources`. Also what an account without a subscription gets,
            so a 404 here is not proof the song has no lyrics.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
        musicUserToken: []
  /v1/catalog/{storefront}/songs/{id}/credits:
    get:
      summary: Credits
      operationId: getSongCredits
      tags:
      - Catalog
      description: 'Everyone who worked on a recording, grouped by role.


        `data` holds `role-categories` rather than artists. Each category has a `kind` such as `performer`
        or `composer` and a localized `title`, and its `credit-artists` relationship holds the people
        in it. Credit artist ids are not catalog artist ids: they look like `4-ami:identity:<hash>`.


        Needs no `Media-User-Token`, unlike the lyrics relationships on the same song.'
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: storefront
        in: path
        required: true
        schema:
          type: string
        description: Two-letter storefront code. An unknown code returns 400 `40009 Unknown Storefront`.
        example: us
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Catalog song id.
        example: '1752214923'
      - $ref: '#/components/parameters/qL'
      - $ref: '#/components/parameters/qPlatform'
      - $ref: '#/components/parameters/qFormatResources'
      - $ref: '#/components/parameters/qArtUrl'
      - name: extend
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - artistUrl
            - credits
            - extendedAssetUrls
            - lyricsExcerpt
            - offers
        description: Extra attributes to add to the returned resources. These values were observed on other endpoints for the same resource type.
          Unknown values are ignored rather than rejected.
        example:
        - artistUrl
        - credits
        - extendedAssetUrls
        - lyricsExcerpt
        - offers
      - name: include
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - albums
            - artists
            - credits
            - lyrics
            - music-videos
        description: Relationships to resolve in the same response. No request builder was found
          for this endpoint, so these are the values observed elsewhere for the same kind of resource.
        example:
        - albums
        - artists
        - credits
        - lyrics
        - music-videos
      responses:
        '200':
          description: Role categories, each with its credited artists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          examples:
                          - 1866517055-4
                        type:
                          type: string
                          enum:
                          - role-categories
                        attributes:
                          type: object
                          properties:
                            kind:
                              type: string
                              examples:
                              - performer
                            title:
                              type: string
                              description: Localized category name.
                        relationships:
                          type: object
                          properties:
                            credit-artists:
                              type: object
                              properties:
                                data:
                                  type: array
                                  items:
                                    $ref: '#/components/schemas/Resource'
        '403':
          description: '`40300 Forbidden` — no valid `Media-User-Token`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
components:
  securitySchemes:
    developerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A valid developer token for this API host. Required for all media API requests.
    musicUserToken:
      type: apiKey
      in: header
      name: Media-User-Token
      description: Identifies the signed-in account.
  parameters:
    hOrigin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
      description: Required. Must be `https://` on `apple.com` or a subdomain; anything else is a bare
        401.
      example: https://music.apple.com
    hReferer:
      name: Referer
      in: header
      required: true
      schema:
        type: string
      description: Include alongside `Origin`. Not checked on its own.
      example: https://music.apple.com/
    qL:
      name: l
      in: query
      required: false
      schema:
        type: string
      description: BCP 47 language tag. An unknown tag is rejected with error 40005.
      example: en-US
    qPlatform:
      name: platform
      in: query
      required: false
      schema:
        type: string
        enum:
        - web
        - iphone
        - ipad
        - desktop
        - appletv
        - watch
      description: Platform identifier. An unknown value is rejected with error 40005.
    qFormatResources:
      name: format[resources]
      in: query
      required: false
      schema:
        type: string
        enum:
        - map
      description: Return related resources as a keyed `resources` map instead of an inline `included` array.
    qTimezone:
      name: timezone
      in: query
      required: false
      schema:
        type: string
      description: Client UTC offset. Only sent when the call site opts in.
    qDisplayfilterKind:
      name: displayFilter[kind]
      in: query
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          type: string
          enum: &id020
          - MusicCardShelf
          - MusicCircleCoverShelf
          - MusicConcertsEmptyShelf
          - MusicCoverGrid
          - MusicCoverShelf
          - MusicHorizontalLockupGrid
          - MusicNotesHeroShelf
          - MusicSocialCardShelf
          - MusicSuperHeroShelf
          - musicSuperHero
      description: Comma-separated display-filter kinds.
      style: form
      explode: false
      example: *id020
    qArtUrl:
      name: art[url]
      in: query
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          type: string
          enum:
          - c
          - f
      description: Artwork URL flags. `c` omits the crop code; `f` omits the file extension.
      example:
      - c
      - f
      style: form
      explode: false
    qOmitResource:
      name: omit[resource]
      in: query
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          type: string
          enum:
          - autos
      description: Comma-separated resource sections to omit from the response.
      example:
      - autos
      style: form
      explode: false
  schemas:
    ResourceIdentifier:
      type: object
      description: A pointer into the `resources` map.
      required:
      - id
      - type
      properties:
        id:
          type: string
        type:
          type: string
          description: Resource type, for example `albums` or `library-songs`.
        href:
          type: string
    Artwork:
      type: object
      description: Artwork descriptor. `url` is a template containing `{w}`, `{h}` and `{f}` placeholders.
      properties:
        url:
          type: string
          examples:
          - https://is1-ssl.mzstatic.com/image/thumb/.../{w}x{h}bb.{f}
        width:
          type:
          - integer
          - 'null'
        height:
          type:
          - integer
          - 'null'
        bgColor:
          type: string
        textColor1:
          type: string
        textColor2:
          type: string
        textColor3:
          type: string
        textColor4:
          type: string
        hasP3:
          type: boolean
    PlayParams:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          examples:
          - album
          - song
          - playlist
          - radioStation
        isLibrary:
          type: boolean
        globalId:
          type: string
    Resource:
      type: object
      description: A catalog, library, or canvas resource. Attributes, relationships, and views depend
        on its type and the request options. Identifier-only entries omit those sections.
      required:
      - id
      - type
      properties:
        id:
          type: string
        type:
          type: string
        href:
          type: string
        attributes:
          type: object
          description: Optional, type-specific fields. Request additional attributes with extend. An unavailable
            attribute can be absent even when requested. See the endpoint descriptions and [Request conventions](/musickit/conventions).
          properties:
            artwork:
              $ref: '#/components/schemas/Artwork'
            playParams:
              $ref: '#/components/schemas/PlayParams'
            display:
              $ref: '#/components/schemas/CanvasDisplay'
            seeAllDisplay:
              $ref: '#/components/schemas/CanvasDisplay'
              description: Expanded collection presentation, requested with extend=seeAllDisplay.
            badge:
              type: array
              items:
                $ref: '#/components/schemas/CanvasBadge'
              description: Optional canvas header badges, requested with extend[canvas-shelves-header]=badge.
            title:
              type: string
              description: Shelf heading, when supplied.
            seeMoreUrl:
              type: string
              description: Navigation URL for additional collection content.
            text:
              type: string
              description: Text content for canvas text shelves.
          additionalProperties: true
        relationships:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Relationship'
        views:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    Relationship:
      type: object
      properties:
        href:
          type: string
        next:
          type: string
          description: Path plus query for the next page, when more data exists.
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResourceIdentifier'
        meta:
          type: object
          additionalProperties: true
    ResourceResponse:
      type: object
      description: With format[resources]=map, data contains resource identifiers and resources contains
        full objects keyed by type and ID. Without that parameter, data contains full resource objects.
        Follow next for subsequent pages.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        resources:
          type: object
          description: Type -> id -> resource.
          additionalProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/Resource'
        next:
          type: string
          description: Path plus query for the next page.
        meta:
          type: object
          additionalProperties: true
    ErrorsResponse:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    Error:
      type: object
      description: 'Observed error codes: 40000 Bad Request, 40003 Missing Parameter, 40004 Invalid Parameter,
        40005 Invalid Parameter Value, 40008 Invalid Path Value, 40009 Unknown Storefront, 40300 Forbidden,
        40301 Invalid Music User Token, 40400 Resource Not Found, 40403 No related resources, 50000 Internal
        Service Error.'
      properties:
        id:
          type: string
          description: Correlates with the `x-apple-jingle-correlation-key` response header.
        title:
          type: string
          examples:
          - Invalid Parameter Value
        detail:
          type: string
          examples:
          - Invalid platform value bogus
        status:
          type: string
          examples:
          - '400'
        code:
          type: string
          examples:
          - '40005'
        meta:
          type: object
          additionalProperties: true
        source:
          type: object
          properties:
            parameter:
              type: string
              description: The query parameter associated with the error, when provided.
          additionalProperties: true
    RelationshipData:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResourceIdentifier'
    CanvasDisplay:
      type: object
      description: Presentation metadata for an artist canvas shelf. Unknown styles may be added.
      properties:
        style:
          type: string
          description: Collection, group, header, text, or marker presentation style.
        layoutDirection:
          type: string
          examples:
          - horizontal
          - vertical
          - vertical-capped
          - adaptive-vertical-capped
          - list
        variants:
          description: Style-specific presentation options; shape varies by style.
      additionalProperties: true
    CanvasBadge:
      type: object
      properties:
        variant:
          type: string
        label:
          type: string
        url:
          type: string
          description: Destination for a linked badge, such as a concerts badge.
      required:
      - variant
      - label
      additionalProperties: true
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
