openapi: 3.1.0
info:
  title: MusicKit
  version: 0.1.0
  summary: Apple Music endpoints for catalog, library, and playback.
  description: 'Browse the Apple Music catalog, manage libraries and playlists, and request

    playback assets. These endpoints use `amp-api.music.apple.com` and the web

    player''s credentials. Tokens issued for `api.music.apple.com` are not

    interchangeable with credentials for this host.'
servers:
- url: https://amp-api.music.apple.com
  description: Default media API host.
security:
- developerToken: []
tags:
- name: Catalog
  description: 'Public catalog resources: albums, songs, artists, playlists, stations, charts, genres.'
- name: Search
  description: Catalog search, search suggestions and search hints.
- name: Editorial
  description: Editorially curated rooms, groupings, multirooms and multiplexes.
- name: Recommendations
  description: Storefront-level recommendation shelves.
- name: Concerts
  description: Concert hub and concert containers.
- name: Lyrics
  description: Lyric snippets used by search result highlights.
- name: Engagement
  description: Subscription upsell and marketing surfaces.
- name: Storefronts
  description: Storefront metadata.
- name: Account
  description: Signed-in account state and preferences.
- name: Library
  description: The signed-in user's library.
- name: Playlists
  description: Library playlist creation and editing.
- name: Pins
  description: Library pins shown on the library landing page.
- name: Social
  description: Apple Music social profiles, following and sharing.
- name: Playback
  description: Playback asset resolution and radio continuation, served by MusicKit.
paths:
  /v1/catalog/{storefront}:
    get:
      summary: Resources by ID
      operationId: getCatalogResourcesByIds
      tags:
      - Catalog
      description: 'Multi-fetch entry point. One `ids[<type>]` parameter per resource type; several may
        be combined in one request. Used by the curator page to fetch `curators` and `apple-curators`
        together, and by the generic content-descriptor loader.


        Requires at least one `ids[...]` parameter: an empty request returns 400 `40003 No ids specified
        on the request`.'
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: storefront
        in: path
        required: true
        schema:
          type: string
        description: Two-letter storefront code. An unknown code returns 400 `40009 Unknown Storefront`.
        example: us
      - name: ids[albums]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
        description: Comma-separated album ids, up to 100.
        style: form
        explode: false
      - name: ids[songs]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
        description: Comma-separated song ids, up to 300.
        style: form
        explode: false
      - name: ids[artists]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
        description: Comma-separated artist ids, up to 50.
        style: form
        explode: false
      - name: ids[curators]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
        description: Comma-separated curator ids, up to 100.
        style: form
        explode: false
      - name: ids[apple-curators]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
        description: Comma-separated Apple curator ids, up to 100.
        style: form
        explode: false
      - name: ids[playlists]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
        description: Comma-separated playlist ids, up to 50.
        style: form
        explode: false
      - name: fields[albums]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: &id001
            - artistName
            - artistUrl
            - artwork
            - contentRating
            - editorialArtwork
            - editorialNotes
            - editorialVideo
            - genreNames
            - name
            - plainEditorialNotes
            - playParams
            - releaseDate
            - trackCount
            - url
        description: Sparse fieldset for albums.
        style: form
        explode: false
        example: *id001
      - name: extend[curators]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: &id002
            - plainEditorialNotes
            - playlistCount
        description: Extra curator attributes, for example `playlistCount`.
        style: form
        explode: false
        example: *id002
      - name: extend[apple-curators]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: &id003
            - plainEditorialNotes
            - playlistCount
        description: Extra Apple-curator attributes.
        style: form
        explode: false
        example: *id003
      - name: relate
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - catalog
            - library
        description: Relationships to return as references.
        example:
        - catalog
        - library
      - $ref: '#/components/parameters/qL'
      - $ref: '#/components/parameters/qPlatform'
      - $ref: '#/components/parameters/qFormatResources'
      - name: include
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - albums
            - artists
            - curator
        description: Relationships to resolve in the same response.
        example:
        - albums
        - artists
        - curator
      - name: extend
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - artistBio
            - artistUrl
            - bornOrFormed
            - credits
            - editorialArtwork
            - editorialVideo
            - extendedAssetUrls
            - followState
            - hasBiographyContent
            - hasCollaboration
            - hasTastePreferences
            - hero
            - hideListeningTo
            - isCollaborativeHost
            - isGroup
            - keyColor
            - lockupStyle
            - lyricsExcerpt
            - notificationSettings
            - offers
            - origin
            - pendingFollowersCount
            - plainEditorialCard
            - plainEditorialNotes
            - playlistCount
            - seeAllDisplay
            - seoDescription
            - seoTitle
            - trackCount
            - uber
        description: Extra attributes to add to the returned resources. These values were observed on other endpoints for the same resource type.
          Unknown values are ignored rather than rejected.
        example:
        - artistBio
        - artistUrl
        - bornOrFormed
        - credits
        - editorialArtwork
        - editorialVideo
        - extendedAssetUrls
        - followState
        - hasBiographyContent
        - hasCollaboration
        - hasTastePreferences
        - hero
        - hideListeningTo
        - isCollaborativeHost
        - isGroup
        - keyColor
        - lockupStyle
        - lyricsExcerpt
        - notificationSettings
        - offers
        - origin
        - pendingFollowersCount
        - plainEditorialCard
        - plainEditorialNotes
        - playlistCount
        - seeAllDisplay
        - seoDescription
        - seoTitle
        - trackCount
        - uber
      - $ref: '#/components/parameters/qArtUrl'
      - $ref: '#/components/parameters/qOmitResource'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '400':
          description: '`40003` missing parameter, `40004` parameter not allowed, `40005` invalid parameter
            value, or `40009` unknown storefront.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/catalog/{storefront}/{type}/{id}:
    get:
      summary: One resource
      operationId: getCatalogResource
      tags:
      - Catalog
      description: Get one catalog resource by type and ID. Use `include`, `extend`, `fields`, and `views` to request related data. For genre reads, use [Genres](/musickit/reference/catalog/getCatalogGenres); a missing genre can return 500 instead of 404.
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: storefront
        in: path
        required: true
        schema:
          type: string
        description: Two-letter storefront code. An unknown code returns 400 `40009 Unknown Storefront`.
        example: us
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum:
          - albums
          - apple-curators
          - artists
          - audio-analysis
          - classical-works
          - concerts
          - curators
          - genres
          - music-movies
          - music-videos
          - playlists
          - record-labels
          - songs
          - station-genres
          - stations
          - tv-episodes
          - tv-seasons
          - tv-shows
          - uploaded-audios
          - uploaded-videos
          - venues
        description: Resource type.
        example: albums
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource id (the store adam id, or a `pl.`-prefixed id for playlists).
        example: '1752214909'
      - name: fields
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated attributes to return on the primary resource.
        example: url,name
      - name: fields[artists]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - artwork
            - editorialArtwork
            - genreNames
            - inFavorites
            - name
            - plainEditorialNotes
            - url
        description: Sparse fieldset for included artists.
        example:
        - name
        - url
        style: form
        explode: false
      - name: fields[albums]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: &id004
            - artistName
            - artistUrl
            - artwork
            - contentRating
            - editorialArtwork
            - editorialNotes
            - editorialVideo
            - genreNames
            - name
            - plainEditorialNotes
            - playParams
            - releaseDate
            - trackCount
            - url
        description: Sparse fieldset for included albums.
        style: form
        explode: false
        example: *id004
      - name: fields[songs]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: &id005
            - albumName
            - artistName
            - artistUrl
            - artwork
            - audioTraits
            - composerName
            - contentRating
            - curatorName
            - durationInMillis
            - extendedAssetUrls
            - hasLyrics
            - name
            - playParams
            - previews
            - url
        description: Sparse fieldset for included songs.
        style: form
        explode: false
        example: *id005
      - name: include[songs]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - albums
            - artists
            - composers
        description: Relationships to include on songs.
        example:
        - artists
        - composers
        - albums
        style: form
        explode: false
      - name: include[albums]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: &id006
            - artists
            - composers
            - tracks
        description: Relationships to include on albums.
        style: form
        explode: false
        example: *id006
      - name: include[music-videos]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: &id007
            - artists
            - catalog
            - composers
            - tracks
        description: Relationships to include on music videos.
        style: form
        explode: false
        example: *id007
      - name: include[playlists]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - curator
            - tracks
        description: Relationships to include on playlists.
        example:
        - curator
        style: form
        explode: false
      - name: include[groupings]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
        description: Relationships to include on groupings.
        style: form
        explode: false
      - name: include[concerts]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - venues
            - artists
            - playlists
        description: Relationships to include on concerts.
        style: form
        explode: false
      - name: extend[concerts]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - eventDataProviders
            - ticketDataProvider
            - tickets
            - url
        description: Extra concert attributes.
        style: form
        explode: false
      - name: omit[resource:artists]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - autos
        description: Omit sections from included artists.
        style: form
        explode: false
      - name: relate[songs]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - albums
        description: Relate songs to another type.
        example:
        - albums
        style: form
        explode: false
      - name: meta[albums:tracks]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - popularity
        description: Extra track metadata on an album's `tracks` relationship.
        example:
        - popularity
        style: form
        explode: false
      - name: limit[tracks]
        in: query
        required: false
        schema:
          type: integer
          maximum: 300
        description: Page size for the `tracks` relationship. Must be 300 or less.
      - name: filter[personal-mix]
        in: query
        required: false
        schema:
          type: string
        description: Personal-mix filter used on editorial playlists.
      - $ref: '#/components/parameters/qL'
      - $ref: '#/components/parameters/qPlatform'
      - $ref: '#/components/parameters/qFormatResources'
      - name: include
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - albums
            - artist-biography-canvas
            - artists
            - bands
            - canvas
            - catalog
            - contents
            - credits
            - curator
            - default-playable-content
            - episodes
            - followees
            - followers
            - grouping
            - listening-to
            - lyrics
            - music-videos
            - pending-followers
            - persons
            - playlists
            - radio-show
            - record-labels
            - shareable-playlists
            - shared-playlists
            - show
            - social-profile
            - tracks
            - tv-seasons
        description: Relationships to resolve in the same response.
        example:
        - albums
        - artist-biography-canvas
        - artists
        - bands
        - canvas
        - catalog
        - contents
        - credits
        - curator
        - default-playable-content
        - episodes
        - followees
        - followers
        - grouping
        - listening-to
        - lyrics
        - music-videos
        - pending-followers
        - persons
        - playlists
        - radio-show
        - record-labels
        - shareable-playlists
        - shared-playlists
        - show
        - social-profile
        - tracks
        - tv-seasons
      - name: extend
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - artistBio
            - artistUrl
            - bornOrFormed
            - credits
            - editorialArtwork
            - editorialVideo
            - extendedAssetUrls
            - followState
            - hasBiographyContent
            - hasCollaboration
            - hasTastePreferences
            - hero
            - hideListeningTo
            - isCollaborativeHost
            - isGroup
            - keyColor
            - lockupStyle
            - lyricsExcerpt
            - notificationSettings
            - offers
            - origin
            - pendingFollowersCount
            - plainEditorialCard
            - plainEditorialNotes
            - playlistCount
            - seeAllDisplay
            - seoDescription
            - seoTitle
            - trackCount
            - uber
        description: Extra attributes to add to the returned resources. This is the generic catalog read,
          so the list spans every resource type; an attribute applies only to the types that define it.
          Unknown values are ignored rather than rejected.
        example:
        - artistBio
        - artistUrl
        - bornOrFormed
        - credits
        - editorialArtwork
        - editorialVideo
        - extendedAssetUrls
        - followState
        - hasBiographyContent
        - hasCollaboration
        - hasTastePreferences
        - hero
        - hideListeningTo
        - isCollaborativeHost
        - isGroup
        - keyColor
        - lockupStyle
        - lyricsExcerpt
        - notificationSettings
        - offers
        - origin
        - pendingFollowersCount
        - plainEditorialCard
        - plainEditorialNotes
        - playlistCount
        - seeAllDisplay
        - seoDescription
        - seoTitle
        - trackCount
        - uber
      - name: views
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - all-upcoming-concerts
            - appears-on
            - appears-on-albums
            - audio-extras
            - collaborators
            - compilation-albums
            - contributors
            - cross-merchandise
            - featured-albums
            - featured-artists
            - featured-on-albums
            - featured-release
            - full-albums
            - latest-release
            - latest-releases
            - live-albums
            - more-by-artist
            - more-by-curator
            - more-in-genre
            - more-to-hear
            - more-to-see
            - more-upcoming-concerts
            - music-artists
            - music-videos
            - nearby-upcoming-concerts
            - other-episodes
            - other-versions
            - playlists
            - radio-shows
            - related-videos
            - similar-artists
            - singles
            - subscribers
            - top-releases
            - top-songs
            - video-extras
            - you-might-also-like
        description: Editorial shelves to attach to the resource. A view applies only to the resource
          types that define it. Unknown values are ignored rather than rejected.
        example:
        - all-upcoming-concerts
        - appears-on
        - appears-on-albums
        - audio-extras
        - collaborators
        - compilation-albums
        - contributors
        - cross-merchandise
        - featured-albums
        - featured-artists
        - featured-on-albums
        - featured-release
        - full-albums
        - latest-release
        - latest-releases
        - live-albums
        - more-by-artist
        - more-by-curator
        - more-in-genre
        - more-to-hear
        - more-to-see
        - more-upcoming-concerts
        - music-artists
        - music-videos
        - nearby-upcoming-concerts
        - other-episodes
        - other-versions
        - playlists
        - radio-shows
        - related-videos
        - similar-artists
        - singles
        - subscribers
        - top-releases
        - top-songs
        - video-extras
        - you-might-also-like
      - name: with
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - album
            - attributes
            - cityCharts
            - concerts
            - dailyGlobalTopCharts
            - friendsMix
            - library
            - lightProfiles
            - lyricHighlights
            - lyrics
            - marketingItems
            - naturalLanguage
            - nonOnboarded
            - nonSubscribers
            - pivot-meta
            - serverBubbles
            - shared
            - social
            - subtitles
            - voice
        description: Optional top-level sections to add to the response. Unknown values are ignored rather
          than rejected.
        example:
        - album
        - attributes
        - cityCharts
        - concerts
        - dailyGlobalTopCharts
        - friendsMix
        - library
        - lightProfiles
        - lyricHighlights
        - lyrics
        - marketingItems
        - naturalLanguage
        - nonOnboarded
        - nonSubscribers
        - pivot-meta
        - serverBubbles
        - shared
        - social
        - subtitles
        - voice
      - name: types
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - activities
            - albums
            - apple-curators
            - artists
            - concerts
            - curators
            - editorial-items
            - library-albums
            - library-playlists
            - music-movies
            - music-videos
            - playlists
            - record-labels
            - social-profiles
            - social-upsells
            - songs
            - stations
            - tv-episodes
            - tv-shows
            - uploaded-audios
            - uploaded-videos
        description: Resource types to return.
        example:
        - activities
        - albums
        - apple-curators
        - artists
        - concerts
        - curators
        - editorial-items
        - library-albums
        - library-playlists
        - music-movies
        - music-videos
        - playlists
        - record-labels
        - social-profiles
        - social-upsells
        - songs
        - stations
        - tv-episodes
        - tv-shows
        - uploaded-audios
        - uploaded-videos
      - name: sparse
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - library-albums
            - library-playlists
        description: Resource types to return in reduced form.
        example:
        - library-albums
        - library-playlists
      - $ref: '#/components/parameters/qDisplayfilterKind'
      - $ref: '#/components/parameters/qTimezone'
      - $ref: '#/components/parameters/qArtUrl'
      - $ref: '#/components/parameters/qOmitResource'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '404':
          description: '`40400 Resource Not Found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '400':
          description: '`40003` missing parameter, `40004` parameter not allowed, `40005` invalid parameter
            value, or `40009` unknown storefront.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/catalog/{storefront}/{type}:
    get:
      summary: Resource collection
      operationId: getCatalogResourceCollection
      tags:
      - Catalog
      description: Collection form of the resource read. Used for stations and TV seasons.
        `filter[upc]` on albums and `filter[isrc]` on songs were confirmed by replay but were not seen
        in the bundles.
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: storefront
        in: path
        required: true
        schema:
          type: string
        description: Two-letter storefront code. An unknown code returns 400 `40009 Unknown Storefront`.
        example: us
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum:
          - albums
          - apple-curators
          - artists
          - audio-analysis
          - classical-works
          - concerts
          - curators
          - genres
          - music-movies
          - music-videos
          - playlists
          - record-labels
          - songs
          - station-genres
          - stations
          - tv-episodes
          - tv-seasons
          - tv-shows
          - uploaded-audios
          - uploaded-videos
          - venues
        description: Resource type.
        example: stations
      - name: ids
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated resource ids. Songs take up to 300, artists and playlists up to 50, and most other types up to 100. More returns error 40010.
        example: ra.978194965
      - name: filter[upc]
        in: query
        required: false
        schema:
          type: string
        description: Look albums up by UPC.
      - name: filter[isrc]
        in: query
        required: false
        schema:
          type: string
        description: Look songs up by ISRC. Accepts a comma-separated batch of
