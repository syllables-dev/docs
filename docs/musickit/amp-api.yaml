      - $ref: '#/components/parameters/hReferer'
      - name: ids
        in: query
        required: false
        schema:
          type: string
        description: Restrict the response to these profile ids.
      - name: filter[handle]
        in: query
        required: false
        schema:
          type: string
        description: Look a profile up by handle.
      - $ref: '#/components/parameters/qL'
      - $ref: '#/components/parameters/qPlatform'
      - $ref: '#/components/parameters/qFormatResources'
      - name: include
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - followees
            - followers
            - listening-to
            - pending-followers
            - shareable-playlists
            - shared-playlists
            - social-profile
        description: Relationships to resolve in the same response. Including `followees` or `followers`
          answers 400 `40013 Invalid Request Signature`.
        example:
        - followees
        - followers
        - listening-to
        - pending-followers
        - shareable-playlists
        - shared-playlists
        - social-profile
      - name: extend
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - followState
            - hideListeningTo
            - pendingFollowersCount
        description: Extra attributes to add to the returned resources. Unknown values are ignored rather
          than rejected.
        example:
        - followState
        - hideListeningTo
        - pendingFollowersCount
      - name: with
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - nonOnboarded
        description: Optional top-level sections to add to the response. Unknown values are ignored rather
          than rejected.
        example:
        - nonOnboarded
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '403':
          description: '`40300 Forbidden` — no valid `Media-User-Token`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - developerToken: []
        musicUserToken: []
    patch:
      summary: Update my profile
      operationId: updateSocialProfile
      tags:
      - Social
      description: Handle collisions come back as a 4xx whose first error carries `meta.suggestedHandles`,
        which can be shown as a suggestion. This request omits `format[resources]=map`.
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: with
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - nonSubscribers
        description: Optional top-level sections to add to the response. Unknown values are ignored rather
          than rejected.
        example:
        - nonSubscribers
      - $ref: '#/components/parameters/qL'
      - $ref: '#/components/parameters/qPlatform'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - attributes
              properties:
                attributes:
                  type: object
                  properties:
                    name:
                      type: string
                    handle:
                      type: string
                    isPrivate:
                      type: boolean
                    hideListeningTo:
                      type: boolean
            example:
              attributes:
                name: Example
                handle: example
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '409':
          description: Handle unavailable. The first error carries `meta.suggestedHandles`.
          content:
