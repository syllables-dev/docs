          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - artistBio
            - artistUrl
            - bornOrFormed
            - credits
            - editorialArtwork
            - editorialVideo
            - extendedAssetUrls
            - followState
            - hasBiographyContent
            - hasCollaboration
            - hasTastePreferences
            - hero
            - hideListeningTo
            - isCollaborativeHost
            - isGroup
            - keyColor
            - lockupStyle
            - lyricsExcerpt
            - notificationSettings
            - offers
            - origin
            - pendingFollowersCount
            - plainEditorialCard
            - plainEditorialNotes
            - playlistCount
            - seeAllDisplay
            - seoDescription
            - seoTitle
            - trackCount
            - uber
        description: Extra attributes to add to the returned resources. These values were observed on other endpoints for the same resource type.
          Unknown values are ignored rather than rejected.
        example:
        - artistBio
        - artistUrl
        - bornOrFormed
        - credits
        - editorialArtwork
        - editorialVideo
        - extendedAssetUrls
        - followState
        - hasBiographyContent
        - hasCollaboration
        - hasTastePreferences
        - hero
        - hideListeningTo
        - isCollaborativeHost
        - isGroup
        - keyColor
        - lockupStyle
        - lyricsExcerpt
        - notificationSettings
        - offers
        - origin
        - pendingFollowersCount
        - plainEditorialCard
        - plainEditorialNotes
        - playlistCount
        - seeAllDisplay
        - seoDescription
        - seoTitle
        - trackCount
        - uber
      - name: fields
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
        description: Sparse fieldset shorthand, unscoped to a resource type.
