      description: |
        The generic single-resource read. Every catalog detail page in the web client goes through this shape; the album, artist and playlist pages differ only in which `include`, `extend`, `fields` and `views` they ask for.

        `genres` returns 500 `Error extracting the attribute 'parentId' for genres` for a nonexistent ID rather than 404. Prefer [Genres](/musickit/reference/catalog/getCatalogGenres) for genre reads. Unknown values in `views` are silently dropped; `genres` and `station-genres` do not reliably reject unknown view names, so a 200 response alone does not establish support.
