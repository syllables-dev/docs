        - seoTitle
        - trackCount
        - uber
      - $ref: '#/components/parameters/qArtUrl'
      - $ref: '#/components/parameters/qOmitResource'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '400':
          description: '`40003` missing parameter, `40004` parameter not allowed, `40005` invalid parameter
            value, or `40009` unknown storefront.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
          x-validation-status: replay-tested
        default:
          $ref: '#/components/responses/Error'
  /v1/catalog/{storefront}/{type}/{id}:
    get:
      summary: One resource
      operationId: getCatalogResource
      tags:
      - Catalog
      x-confidence: high
      x-validation-status: replay-tested
      x-evidence:
      - asset: assets/index~8bc3c631ba.js
        location: line 66183
        excerpt: 'const o = new it(`/v1/catalog/${e}/${r}/${s}`, n); o.queryString.addParameters({ platform:
          "web", "omit[resource]": "autos" })'
        discovery: static
      - asset: assets/index~8bc3c631ba.js
        location: line 30853
        excerpt: function YV(t, e) { const n = new it(t, e); n.queryString.extend.add("offers").add("editorialArtwork").add("editorialVideo").add("extendedAssetUrls")
          ... }
        discovery: static
