        - library
      - $ref: '#/components/parameters/qL'
      - $ref: '#/components/parameters/qPlatform'
      - $ref: '#/components/parameters/qFormatResources'
      - name: include
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - albums
            - artists
            - curator
        description: Relationships to resolve in the same response.
        example:
        - albums
        - artists
        - curator
      - name: extend
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - artistBio
            - artistUrl
            - bornOrFormed
            - credits
            - editorialArtwork
            - editorialVideo
            - extendedAssetUrls
            - followState
            - hasBiographyContent
            - hasCollaboration
            - hasTastePreferences
            - hero
            - hideListeningTo
            - isCollaborativeHost
            - isGroup
            - keyColor
            - lockupStyle
            - lyricsExcerpt
            - notificationSettings
            - offers
            - origin
            - pendingFollowersCount
            - plainEditorialCard
            - plainEditorialNotes
            - playlistCount
            - seeAllDisplay
            - seoDescription
            - seoTitle
            - trackCount
            - uber
        description: Extra attributes to add to the returned resources. The web client has no request
          builder for this endpoint, so these are the values observed elsewhere for the same kind of resource.
          Unknown values are ignored rather than rejected.
        example:
        - artistBio
        - artistUrl
        - bornOrFormed
        - credits
        - editorialArtwork
        - editorialVideo
        - extendedAssetUrls
        - followState
        - hasBiographyContent
        - hasCollaboration
        - hasTastePreferences
        - hero
        - hideListeningTo
        - isCollaborativeHost
        - isGroup
        - keyColor
        - lockupStyle
        - lyricsExcerpt
        - notificationSettings
        - offers
        - origin
