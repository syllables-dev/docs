          - music-videos
          - playlists
          - record-labels
          - songs
          - station-genres
          - stations
          - tv-episodes
          - tv-seasons
          - tv-shows
          - uploaded-audios
          - uploaded-videos
          - venues
        description: Resource type.
        example: albums
        x-confidence: high
        x-validation-status: Enumerated against the live API on 2026-09-21. The API validates this segment
          before it looks the resource up, so an unknown name answers 400 `40008` whatever id follows
          it.
      - name: id
