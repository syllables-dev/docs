  /v1/concerts/{storefront}/hub:
    get:
      summary: Concerts hub
      operationId: getConcertsHub
      tags:
      - Concerts
      description: '`geoHashLocation` must be exactly four characters. Replay without it returned 500,
        and with a three-character hash returned 400 `40005 Geo Hash ''9q5'' must be exactly 4 characters
        long`, so the parameter is treated as required here although a request path omits
        it.'
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: storefront
        in: path
        required: true
        schema:
          type: string
        description: Two-letter storefront code. An unknown code returns 400 `40009 Unknown Storefront`.
        example: us
      - name: geoHashLocation
        in: query
        required: true
        schema:
          type: string
          minLength: 4
          maxLength: 4
        description: Four-character geohash of the viewer's location.
        example: 9q5c
      - name: containers
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-z-]+(,[a-z-]+)*$
        description: Comma-separated container names. Supported values include `concerts-this-week`,
          `concerts-next-week`, `popular-concerts`, `favorite-artists-concerts`, `all-upcoming-concerts`
          and `more-upcoming-concerts`.
        example: concerts-this-week,concerts-next-week,popular-concerts
      - name: limit[concerts-this-week]
        in: query
        required: false
        schema:
          type: integer
        description: Page size for that container.
        example: 12
      - name: limit[popular-concerts]
        in: query
        required: false
        schema:
          type: integer
        description: Page size for that container.
        example: 6
      - name: filter[date]
        in: query
        required: false
        schema:
          type: string
        description: Date range, written `YYYY-MM-DD..YYYY-MM-DD`.
        example: 2026-09-21..2026-10-21
      - name: filter[genre]
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated genre ids.
      - name: include[concerts]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - artists
            - playlists
            - venues
        description: Relationships to include on concerts.
        example:
        - venues
        - artists
        style: form
        explode: false
      - name: art[artists:url]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - c
