  /v1/catalog/{storefront}/{type}/{id}/{relationship}:
    get:
      summary: Relationship
      operationId: getCatalogResourceRelationship
      tags:
      - Catalog
      description: |
        Generic relationship read. `tracks` and `credits` were replay-confirmed. `lyrics` and `syllable-lyrics` resolve as relationship names but return 404 `40403 No related resources` without a subscribed `Media-User-Token`, so their response shape is not documented here.

        An unknown relationship returns `40008`. A supported relationship with no related resources returns `40403`. The `library` relationship maps a catalog resource to the signed-in account's copy.

        | Type | Relationships |
        | --- | --- |
        | `albums` | `artists`, `genres`, `library`, `record-labels`, `tracks`, `works` |
        | `apple-curators` | `events`, `playlists` |
        | `artists` | `albums`, `genres`, `music-videos`, `playlists`, `songs`, `station` |
        | `audio-analysis` | Not listed. |
        | `classical-works` | `composers` |
        | `concerts` | `artists`, `playlists`, `venues` |
        | `curators` | `playlists` |
        | `genres` | Not listed. |
        | `music-movies` | `genres` |
        | `music-videos` | `albums`, `artists`, `genres`, `library`, `songs` |
        | `playlists` | `curator`, `library`, `tracks` |
        | `record-labels` | Not listed. |
        | `songs` | `albums`, `artists`, `audio-analysis`, `composers`, `credits`, `genres`, `library`, `lyrics`, `music-videos`, `station`, `syllable-lyrics` |
        | `station-genres` | `stations` |
        | `stations` | `events` |
        | `tv-episodes` | `genres`, `seasons` |
        | `tv-seasons` | `episodes`, `genres` |
        | `tv-shows` | `tv-seasons` |
        | `uploaded-audios` | `artists`, `curator` |
        | `uploaded-videos` | `artists`, `curator` |
        | `venues` | Not listed. |
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: storefront
        in: path
        required: true
        schema:
          type: string
        description: Two-letter storefront code. An unknown code returns 400 `40009 Unknown Storefront`.
        example: us
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum:
          - albums
          - apple-curators
          - artists
          - audio-analysis
          - classical-works
          - concerts
          - curators
          - genres
          - music-movies
          - music-videos
          - playlists
          - record-labels
          - songs
          - station-genres
          - stations
          - tv-episodes
          - tv-seasons
          - tv-shows
          - uploaded-audios
          - uploaded-videos
          - venues
        description: Resource type.
        example: playlists
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource id.
      - name: relationship
        in: path
        required: true
        schema:
          type: string
          enum:
          - albums
          - artists
          - audio-analysis
          - composers
          - credits
          - curator
          - episodes
          - events
          - genres
          - library
          - lyrics
          - music-videos
          - playlists
          - record-labels
          - seasons
          - songs
          - station
          - stations
          - syllable-lyrics
          - tracks
          - tv-seasons
          - venues
          - works
        description: Relationship name.
        example: tracks
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 300
        description: "Page size. The maximum depends on the relationship: 300 for album and playlist tracks, 100 for artist albums and music videos, 25 for Apple curator playlists, 1 for a playlist's curator, and 10 for the rest."
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Zero-based offset. Responses carry a `next` string when more data exists.
      - $ref: '#/components/parameters/qL'
      - $ref: '#/components/parameters/qPlatform'
      - $ref: '#/components/parameters/qFormatResources'
      - name: include
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - albums
            - artist-biography-canvas
            - artists
            - bands
            - canvas
            - catalog
            - contents
            - credits
            - curator
            - default-playable-content
            - episodes
            - followees
            - followers
            - grouping
            - listening-to
            - lyrics
            - music-videos
            - pending-followers
            - persons
            - playlists
            - radio-show
            - record-labels
            - shareable-playlists
            - shared-playlists
            - show
            - social-profile
            - tracks
            - tv-seasons
        description: Relationships to resolve in the same response. No request builder was found
          for this endpoint, so these are the values observed elsewhere for the same kind of resource.
        example:
        - albums
        - artist-biography-canvas
        - artists
        - bands
        - canvas
        - catalog
        - contents
        - credits
        - curator
        - default-playable-content
        - episodes
        - followees
        - followers
        - grouping
        - listening-to
        - lyrics
        - music-videos
        - pending-followers
        - persons
        - playlists
        - radio-show
        - record-labels
        - shareable-playlists
        - shared-playlists
        - show
        - social-profile
        - tracks
        - tv-seasons
      - name: extend
        in: query
        required: false
        style: form
        explode: false
