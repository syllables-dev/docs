        location: music.apple.com album page, 2026-09-20
        excerpt: GET https://amp-api.music.apple.com/v1/catalog/us/albums/1752214909?art[url]=f&extend=editorialArtwork,editorialVideo,extendedAssetUrls,offers,seoDescription,seoTitle&format[resources]=map&include=record-labels,artists&include[songs]=artists,composers,albums&l=en-US&meta[albums:tracks]=popularity&platform=web&views=appears-on,audio-extras,more-by-artist,other-versions,related-videos,video-extras,you-might-also-like
