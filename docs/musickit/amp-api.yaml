  /v1/engagement/{storefront}/upsell:
    post:
      summary: Upsell message
      operationId: postEngagementUpsell
      tags:
      - Engagement
      description: 'MarketingKit''s message resolution call. Unlike every other operation here it is a
        POST with a JSON body, and it is served from `amp-api-edge.media.apple.com` rather than `amp-api.music.apple.com`.
        Replaying the same request against `amp-api.music.apple.com` returned 500, so the host is not
        interchangeable.


        The response is a MarketingKit model tree (`kind: offer-button`, nested `text`, `color`, `buy`
        and `metrics` models) rather than a catalog resource, so it is typed loosely here.'
      servers:
      - url: https://amp-api-edge.media.apple.com
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: storefront
        in: path
        required: true
        schema:
          type: string
        description: Two-letter storefront code. An unknown code returns 400 `40009 Unknown Storefront`.
        example: us
      - name: types
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - marketing-items
            - message-items
        description: Resource types to return.
        example:
        - marketing-items
        - message-items
      - name: meta[marketing-items]
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - metrics
        description: Extra metadata on marketing items.
        example:
        - metrics
        style: form
        explode: false
      - $ref: '#/components/parameters/qL'
      - $ref: '#/components/parameters/qPlatform'
      - name: include
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - contents
        description: Relationships to resolve in the same response.
        example:
        - contents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - messagePlatform
              - items
              properties:
                messagePlatform:
                  type: string
                  examples:
                  - Web
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      framework:
                        type: string
                        examples:
                        - marketingKit
                      frameworkVersion:
                        type: string
                        examples:
                        - '1.0'
                      contextVersion:
                        type: string
                        examples:
                        - V2
                      customerEngagementId:
                        type: string
                        examples:
                        - appleMusic
                      placement:
                        type: object
                        properties:
                          kind:
                            type: string
                            examples:
                            - offerSnippet
                      messageContext:
                        type: object
                        properties:
                          intent:
                            type: string
                            examples:
                            - purchase
            example:
              messagePlatform: Web
              items:
              - framework: marketingKit
                frameworkVersion: '1.0'
                contextVersion: V2
                customerEngagementId: appleMusic
                placement:
                  kind: offerSnippet
                messageContext:
                  intent: purchase
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
        4XX:
          description: Request rejected. See the shared error-code table on the `Error` schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/account:
    get:
      summary: Account
      operationId: getAccount
      tags:
      - Account
      description: 'The signed-in account, its restrictions and its subscription state.


        Called with different `extend` and `meta` values depending on what the caller needs: `extend=hasTastePreferences`
        for onboarding, `extend=notificationSettings` for the settings page, and `meta=subscription` with
        `challenge[subscriptionCapabilities]=voice,premium` for the subscription gate.


        The response nests the account under `resources.accounts.me`.'
      parameters:
      - $ref: '#/components/parameters/hOrigin'
      - $ref: '#/components/parameters/hReferer'
      - name: meta
        in: query
        required: false
        schema:
          type: string
          enum:
          - subscription
        description: Extra account metadata.
        example: subscription
      - name: challenge[subscriptionCapabilities]
        in: query
        required: false
        schema:
          type: string
        description: Capabilities to evaluate the subscription against.
        example: voice,premium
      - $ref: '#/components/parameters/qL'
      - $ref: '#/components/parameters/qPlatform'
      - $ref: '#/components/parameters/qFormatResources'
      - name: extend
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - hasTastePreferences
            - notificationSettings
        description: 'Extra attributes to add to the returned resources. Reads of account state should
          send `cache: no-cache`. Unknown values are ignored rather than rejected.'
        example:
        - hasTastePreferences
        - notificationSettings
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '403':
          description: '`40300 Forbidden` — no valid `Media-User-Token`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/Error'
