        description: Omit to pin the item. Send `top`, or the id of another pin, to reorder an existing
          pin.
        example: top
      - $ref: '#/components/parameters/qL'
      - $ref: '#/components/parameters/qPlatform'
      - $ref: '#/components/parameters/qFormatResources'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: string
            example: ''
      responses:
        '200':
          description: Accepted. Poll `GET /v1/me/library/pins` to confirm the change.
          content:
            application/json:
              schema: {}
        '403':
          description: '`40300 Forbidden` — no valid `Media-User-Token`.'
