        `after` the item is pinned, with an empty string body. With `after` an existing pin is moved:
        `top` puts it first, any other value is the id of the pin to place it behind. Both forms return
        before the change is readable. Poll `GET /v1/me/library/pins` until the
        expected state appears, rather than trusting the response.'
